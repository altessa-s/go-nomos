name: Commit Validation

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Fetch enough history to validate all commits in PR
          fetch-depth: 0
      
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          printf 'Event: %s\n' "$EVENT_NAME"
          printf 'Ref: %s\n' "$GIT_REF"
          printf 'SHA: %s\n' "$GIT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf 'Base ref: %s\n' "$BASE_REF"
            printf 'Head ref: %s\n' "$HEAD_REF"
          fi
          
          echo "Git log (last 10 commits):"
          git log --oneline -10
          
          echo "Running validation script..."
          chmod +x .github/scripts/validate-commits.sh
          .github/scripts/validate-commits.sh || {
            echo "Validation script failed with exit code $?"
            echo "Checking what commits were processed..."
            exit 1
          }

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            commit_scopes.txt
            .github/scripts
      
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          
          # Colors
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m'
          
          echo "Validating PR title: $PR_TITLE"
          
          # Valid types
          VALID_TYPES="feat fix docs style refactor test chore ci perf build"
          
          # Check Conventional Commits format. The regex must live in a
          # variable rather than appear literally on the RHS of [[ =~ ]] —
          # bash 5.2 (Ubuntu 24.04 runner default) tightened parsing and
          # rejects bare regex with parens/escapes as a syntax error.
          TITLE_PATTERN='^([a-z]+)(\(([^)]+)\))?:[[:space:]](.+)'
          if [[ "$PR_TITLE" =~ $TITLE_PATTERN ]]; then
              TYPE="${BASH_REMATCH[1]}"
              SCOPE="${BASH_REMATCH[3]}"
              DESC="${BASH_REMATCH[4]}"
              
              # Check type
              if ! echo "$VALID_TYPES" | grep -wq "$TYPE"; then
                  echo -e "${RED}✗ Invalid type '$TYPE'${NC}"
                  echo "Valid types: $VALID_TYPES"
                  exit 1
              fi
              
              # Check scope if present
              if [[ -n "$SCOPE" ]]; then
                  # Extract valid scopes from commit_scopes.txt
                  if ! grep -E "^[a-zA-Z0-9/_-]+" commit_scopes.txt | awk '{print $1}' | grep -v '^#' | grep -Fxq "$SCOPE"; then
                      echo -e "${RED}✗ Invalid scope '$SCOPE'${NC}"
                      echo "Check commit_scopes.txt for valid scopes"
                      exit 1
                  fi
              fi
              
              # Check description
              if [[ -z "$DESC" ]]; then
                  echo -e "${RED}✗ Missing description${NC}"
                  exit 1
              elif [[ "${DESC:0:1}" =~ [A-Z] ]]; then
                  echo -e "${YELLOW}⚠ Description should start with lowercase${NC}"
              fi
              
              echo -e "${GREEN}✓ Valid PR title${NC}"
          else
              echo -e "${RED}✗ PR title doesn't follow Conventional Commits format${NC}"
              echo "Expected: type(scope): description"
              echo "Examples:"
              echo "  feat(loader): add a JSON backend"
              echo "  fix(loader/secrets): keep quoted placeholders"
              echo "  docs(loader): update examples"
              exit 1
          fi